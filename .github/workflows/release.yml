name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend deps
        run: cd ui && bun install

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: GitAxon ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false

      - name: Get version and SHA256
        id: info
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="src-tauri/target/release/bundle/dmg/GitAxon_${VERSION}_x64.dmg"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.info.outputs.VERSION }}
          SHA256: ${{ steps.info.outputs.SHA }}
        run: |
          git clone https://x-access-token:${TAP_TOKEN}@github.com/VedangP57/homebrew-tap.git /tmp/tap
          cat > /tmp/tap/Casks/gitaxon.rb << EOF
          cask "gitaxon" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/VedangP57/GitAxon/releases/download/v${VERSION}/GitAxon_${VERSION}_x64.dmg"
            name "GitAxon"
            desc "Fast desktop Git GUI — commit graph, multi-repo tabs, conflict resolver"
            homepage "https://github.com/VedangP57/GitAxon"

            app "GitAxon.app"

            zap trash: [
              "~/Library/Application Support/com.gitaxon.desktop",
              "~/Library/Preferences/com.gitaxon.desktop.plist",
              "~/Library/Caches/com.gitaxon.desktop",
            ]

            caveats <<~EOS
              GitAxon is not notarized. If macOS blocks it on first launch, run:
                xattr -cr /Applications/GitAxon.app
            EOS
          end
          EOF
          cd /tmp/tap
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add Casks/gitaxon.rb
          git commit -m "chore: bump gitaxon to v${VERSION}"
          git push
