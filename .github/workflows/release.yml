name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: aarch64
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend deps
        run: cd ui && bun install

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: GitAxon ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false

  update-homebrew:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew tap with both arch SHAs
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          curl -fL -o arm.dmg "https://github.com/VedangP57/GitAxon/releases/download/${TAG}/GitAxon_${VERSION}_aarch64.dmg"
          curl -fL -o intel.dmg "https://github.com/VedangP57/GitAxon/releases/download/${TAG}/GitAxon_${VERSION}_x64.dmg"

          SHA_ARM=$(sha256sum arm.dmg | awk '{print $1}')
          SHA_INTEL=$(sha256sum intel.dmg | awk '{print $1}')

          git clone https://x-access-token:${TAP_TOKEN}@github.com/VedangP57/homebrew-tap.git /tmp/tap

          cat > /tmp/tap/Casks/gitaxon.rb << EOF
          cask "gitaxon" do
            arch arm: "aarch64", intel: "x64"

            version "${VERSION}"
            sha256 arm:   "${SHA_ARM}",
                   intel: "${SHA_INTEL}"

            url "https://github.com/VedangP57/GitAxon/releases/download/v#{version}/GitAxon_#{version}_#{arch}.dmg"
            name "GitAxon"
            desc "Fast desktop Git GUI — commit graph, multi-repo tabs, conflict resolver"
            homepage "https://github.com/VedangP57/GitAxon"

            app "GitAxon.app"

            zap trash: [
              "~/Library/Application Support/com.gitaxon.desktop",
              "~/Library/Preferences/com.gitaxon.desktop.plist",
              "~/Library/Caches/com.gitaxon.desktop",
            ]

            caveats <<~EOS
              GitAxon is not notarized. If macOS blocks it on first launch, run:
                xattr -cr /Applications/GitAxon.app
            EOS
          end
          EOF

          cd /tmp/tap
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add Casks/gitaxon.rb
          git commit -m "chore: bump gitaxon to v${VERSION}"
          git push
