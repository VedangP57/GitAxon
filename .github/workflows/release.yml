name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend deps
        run: cd ui && bun install

      - name: Build Tauri app
        run: cargo tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Compute SHA256
        id: sha
        run: |
          DMG="src-tauri/target/release/bundle/dmg/GitAxon_${{ steps.version.outputs.VERSION }}_x64.dmg"
          echo "SHA=$(shasum -a 256 $DMG | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "DMG_PATH=$DMG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GitAxon v${{ steps.version.outputs.VERSION }}
          files: ${{ steps.sha.outputs.DMG_PATH }}
          generate_release_notes: true

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          SHA256: ${{ steps.sha.outputs.SHA }}
        run: |
          git clone https://x-access-token:${TAP_TOKEN}@github.com/VedangP57/homebrew-tap.git /tmp/tap
          cat > /tmp/tap/Casks/gitaxon.rb << EOF
          cask "gitaxon" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/VedangP57/GitAxon/releases/download/v${VERSION}/GitAxon_${VERSION}_x64.dmg"
            name "GitAxon"
            desc "Fast desktop Git GUI — commit graph, multi-repo tabs, conflict resolver"
            homepage "https://github.com/VedangP57/GitAxon"

            app "GitAxon.app"

            zap trash: [
              "~/Library/Application Support/com.gitaxon.desktop",
              "~/Library/Preferences/com.gitaxon.desktop.plist",
              "~/Library/Caches/com.gitaxon.desktop",
            ]

            caveats <<~EOS
              GitAxon is not notarized. If macOS blocks it on first launch, run:
                xattr -cr /Applications/GitAxon.app
            EOS
          end
          EOF
          cd /tmp/tap
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add Casks/gitaxon.rb
          git commit -m "chore: bump gitaxon to v${VERSION}"
          git push
