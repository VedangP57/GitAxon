<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitFast</title>
  <!-- Tauri injects window.__TAURI__ automatically -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 12px;
    }
    h1 { font-size: 48px; font-weight: 700; letter-spacing: -1px; }
    p { color: #8b949e; font-size: 16px; }
    button {
      margin-top: 24px;
      padding: 10px 24px;
      background: #238636;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #2ea043; }
    pre {
      margin-top: 24px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 16px;
      font-size: 12px;
      color: #e6edf3;
      max-width: 800px;
      max-height: 300px;
      overflow: auto;
      text-align: left;
      min-width: 400px;
    }
  </style>
</head>
<body>
  <h1>⚡ GitFast</h1>
  <p>Backend ready. UI coming soon.</p>
  <button onclick="testBackend()">Test Backend</button>
  <pre id="output">Click the button, then select a git repository folder...</pre>

  <script>
  async function testBackend() {
    const output = document.getElementById('output');
    output.textContent = 'Opening folder picker...';
    try {
      const { invoke } = window.__TAURI__.core;
      const { open } = window.__TAURI__.dialog;

      const repoPath = await open({
        directory: true,
        multiple: false,
      });
      if (!repoPath) {
        output.textContent = 'No folder selected.';
        return;
      }

      output.textContent = 'Loading...';
      const [commits, branches, status] = await Promise.all([
        invoke('get_commits', { repoPath, limit: 3, offset: 0 }),
        invoke('get_branches', { repoPath }),
        invoke('get_status', { repoPath }),
      ]);

      const commitsData = JSON.parse(commits);
      const branchesData = JSON.parse(branches);
      const statusData = JSON.parse(status);

      output.textContent = JSON.stringify({
        first_3_commits: commitsData.slice(0, 3).map(c => ({
          hash: c.commit.short_hash,
          message: c.commit.message.split('\n')[0],
          lane: c.lane
        })),
        branches: branchesData.map(b => b.name),
        changed_files: statusData.length
      }, null, 2);
    } catch (err) {
      output.textContent = 'Error: ' + String(err);
    }
  }
</script>
</body>
</html>
