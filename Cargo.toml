[package]
name = "gitfast-core"
version = "0.1.0"
edition = "2021"
description = "Fast git operations library"

[dependencies]
gix = { version = "0.80", features = ["blocking-network-client"] }
git2 = "0.20"
tokio = { version = "1.50", features = ["full"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0"
anyhow = "1.0.102"
clap = { version = "4.5", features = ["derive"] }
objc2 = "0.6"
notify = { version = "8.2.0", features = ["macos_kqueue"] }
notify-debouncer-mini = "0.7.0"
once_cell = "1.19"
dirs = "6.0"

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "graph_bench"
harness = false
